# Modelos candidatos, embedders e perfis de hardware.
# Arquivos baixados com `python -m evals download <id>` (ou --all) para models/.
# Tamanhos conferidos no Hugging Face em 2026-10-03.

[defaults]
llama_dir = "vendor/llama.cpp/current"   # scripts/setup-llama-cpp.sh
models_dir = "models"
results_dir = "results"
port = 8089
temperature = 0.0
seed = 42

# ---------------------------------------------------------------- perfis
# `args` vão para o llama-server; `bench_args` são os equivalentes do llama-bench.

[profiles.dev]
description = "notebook de desenvolvimento, só CPU: valida o harness e a qualidade com modelos pequenos"
args = ["-ngl", "0", "-c", "8192", "-t", "4"]
bench_args = ["-ngl", "0", "-t", "4"]

[profiles.dev-vulkan]
description = "notebook com a iGPU via Vulkan (só para conferir que o backend Vulkan funciona)"
args = ["-ngl", "99", "-c", "8192"]
bench_args = ["-ngl", "99"]

[profiles.rx7600]
description = "ALVO: RX 7600 8 GB via Vulkan, contexto 16k, KV em q8_0, flash attention"
args = ["-ngl", "99", "-c", "16384", "-fa", "on", "-ctk", "q8_0", "-ctv", "q8_0"]
bench_args = ["-ngl", "99", "-fa", "on", "-ctk", "q8_0", "-ctv", "q8_0"]
env = { GGML_VK_VISIBLE_DEVICES = "0" }

[profiles.rx7600-8k]
description = "ALVO: contexto 8k, KV f16 (compara com o perfil de 16k/q8_0)"
args = ["-ngl", "99", "-c", "8192", "-fa", "on"]
bench_args = ["-ngl", "99", "-fa", "on"]
env = { GGML_VK_VISIBLE_DEVICES = "0" }

[profiles.r5700x-cpu]
description = "ALVO sem GPU: Ryzen 7 5700X (8C/16T), linha de base caso a GPU não esteja disponível"
args = ["-ngl", "0", "-c", "8192", "-t", "8"]
bench_args = ["-ngl", "0", "-t", "8"]

# ---------------------------------------------------------------- modelos de chat/classificação
# `--reasoning off`: a tarefa é de saída estruturada curta; raciocínio só gasta tempo
# (dá para testar com raciocínio via --server-args "--reasoning on").

