# ---------------------------------------------------------------- embedders (chat tipo 2)

[[embedders]]
id = "e5-small-q8"
repo = "TwinSunsLLC/multilingual-e5-small-gguf"
file = "multilingual-e5-small-q8_0.gguf"
quant = "Q8_0"
args = ["--pooling", "mean", "-c", "8192", "-b", "8192", "-ub", "8192"]
